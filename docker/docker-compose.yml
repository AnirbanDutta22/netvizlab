services:
  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      LOG_LEVEL: info
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      RATE_LIMIT_WINDOW_MS: 60000
      RATE_LIMIT_MAX_REQUESTS: 30
      MAX_CONCURRENT_SESSIONS_PER_SOCKET: 3
    cap_add:
      - NET_RAW
    networks:
      - netvizlab

  client:
    build:
      context: ..
      dockerfile: docker/Dockerfile.client
      args:
        VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:4000/ws}
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - server
    networks:
      - netvizlab

networks:
  netvizlab:
    driver: bridge
