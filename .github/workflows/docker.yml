name: Docker - Build and Push

on:
  workflow_run:
    workflows: ["CI - Code Checks"]
    branches: ["master"]
    types:
      - completed

env:
  GAR_LOCATION: asia-south1
  GAR_REPO: netvizlab-repo

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Authorize Docker for GCP Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev

      - name: Build and Push Server Image
        run: |
          SERVER_URI="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.GAR_REPO }}/server:${{ github.sha }}"
          SERVER_LATEST="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.GAR_REPO }}/server:latest"

          docker build -f docker/Dockerfile.server -t $SERVER_URI -t $SERVER_LATEST .
          docker push $SERVER_URI
          docker push $SERVER_LATEST

      - name: Build and Push Client Image
        run: |
          CLIENT_URI="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.GAR_REPO }}/client:${{ github.sha }}"
          CLIENT_LATEST="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.GAR_REPO }}/client:latest"

          docker build \
            --build-arg VITE_WS_URL="${{ secrets.VITE_WS_URL }}" \
            -f docker/Dockerfile.client \
            -t $CLIENT_URI -t $CLIENT_LATEST .
          docker push $CLIENT_URI
          docker push $CLIENT_LATEST
