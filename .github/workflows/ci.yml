name: CI - Code Checks

on:
  push:
    branches: ["master"]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies across workspaces
        run: npm ci

      - name: Build Shared & Workspace packages
        run: |
          npm run build -w shared --if-present
          npm run build -w server --if-present
          npm run build -w client --if-present

      - name: Run Tests
        run: npm test --if-present
